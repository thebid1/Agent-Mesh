<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Mesh - Trading Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a25;
      --bg-hover: #252538;
      --text-primary: #ffffff;
      --text-secondary: #8b8b9e;
      --accent-green: #00d084;
      --accent-red: #ff4757;
      --accent-blue: #3498db;
      --accent-purple: #9b59b6;
      --accent-orange: #f39c12;
      --accent-cyan: #00d4ff;
      --border-color: #2a2a3c;
      --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --gradient-4: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Background Animation */
    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow-1 {
      background: var(--accent-purple);
      top: -200px;
      right: -200px;
    }

    .bg-glow-2 {
      background: var(--accent-blue);
      bottom: -200px;
      left: -200px;
    }

    /* Header */
    .header {
      position: relative;
      z-index: 10;
      padding: 20px 30px;
      background: rgba(18, 18, 26, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-icon {
      width: 50px;
      height: 50px;
      background: var(--gradient-1);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
    }

    .logo-text h1 {
      font-size: 24px;
      font-weight: 700;
      background: var(--gradient-1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .logo-text p {
      color: var(--text-secondary);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: var(--bg-card);
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Main Container */
    .container {
      position: relative;
      z-index: 10;
      padding: 30px;
      max-width: 1800px;
      margin: 0 auto;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--gradient-1);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .stat-card:hover::before {
      opacity: 1;
    }

    .stat-card.green::before { background: var(--gradient-4); }
    .stat-card.red::before { background: var(--gradient-2); }
    .stat-card.blue::before { background: var(--gradient-3); }
    .stat-card.purple::before { background: var(--gradient-1); }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .stat-card.green .stat-icon { background: rgba(0, 208, 132, 0.1); color: var(--accent-green); }
    .stat-card.red .stat-icon { background: rgba(255, 71, 87, 0.1); color: var(--accent-red); }
    .stat-card.blue .stat-icon { background: rgba(52, 152, 219, 0.1); color: var(--accent-blue); }
    .stat-card.purple .stat-icon { background: rgba(155, 89, 182, 0.1); color: var(--accent-purple); }

    .stat-change {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .stat-change.positive {
      background: rgba(0, 208, 132, 0.1);
      color: var(--accent-green);
    }

    .stat-change.negative {
      background: rgba(255, 71, 87, 0.1);
      color: var(--accent-red);
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .stat-label {
      color: var(--text-secondary);
      font-size: 14px;
    }

    /* Section Title */
    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      font-size: 18px;
      font-weight: 600;
    }

    .section-title i {
      color: var(--accent-cyan);
    }

    /* Dashboard Grid */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    @media (max-width: 1200px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-title i {
      color: var(--accent-cyan);
    }

    /* Agent Cards */
    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .agent-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.3s ease;
      position: relative;
    }

    .agent-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      border-radius: 16px 0 0 16px;
    }

    .agent-card.arbitrageur::before { background: var(--accent-green); }
    .agent-card.trend::before { background: var(--accent-blue); }
    .agent-card.lp::before { background: var(--accent-purple); }
    .agent-card.banker::before { background: var(--accent-orange); }

    .agent-card:hover {
      transform: translateY(-3px);
      border-color: rgba(99, 102, 241, 0.3);
    }

    .agent-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 16px;
    }

    .agent-avatar {
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
    }

    .agent-card.arbitrageur .agent-avatar { background: rgba(0, 208, 132, 0.1); color: var(--accent-green); }
    .agent-card.trend .agent-avatar { background: rgba(52, 152, 219, 0.1); color: var(--accent-blue); }
    .agent-card.lp .agent-avatar { background: rgba(155, 89, 182, 0.1); color: var(--accent-purple); }
    .agent-card.banker .agent-avatar { background: rgba(243, 156, 18, 0.1); color: var(--accent-orange); }

    .agent-info h3 {
      font-size: 16px;
      margin-bottom: 4px;
    }

    .agent-info span {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .agent-status {
      margin-left: auto;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .agent-status.active {
      background: rgba(0, 208, 132, 0.1);
      color: var(--accent-green);
    }

    .agent-status.paused {
      background: rgba(255, 71, 87, 0.1);
      color: var(--accent-red);
    }

    .agent-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .metric {
      text-align: center;
      padding: 12px;
      background: var(--bg-secondary);
      border-radius: 10px;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .metric-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    /* Transactions Table */
    .transactions-card {
      grid-column: 1 / -1;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    td {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 14px;
    }

    tr:hover td {
      background: var(--bg-hover);
    }

    .token-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: var(--bg-secondary);
      border-radius: 20px;
      font-weight: 600;
    }

    .action-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .action-badge.buy {
      background: rgba(0, 208, 132, 0.1);
      color: var(--accent-green);
    }

    .action-badge.sell {
      background: rgba(255, 71, 87, 0.1);
      color: var(--accent-red);
    }

    .action-badge.add {
      background: rgba(155, 89, 182, 0.1);
      color: var(--accent-purple);
    }

    .action-badge.send {
      background: rgba(52, 152, 219, 0.1);
      color: var(--accent-blue);
    }

    .pnl {
      font-weight: 600;
    }

    .pnl.positive {
      color: var(--accent-green);
    }

    .pnl.negative {
      color: var(--accent-red);
    }

    /* Chart Container */
    .chart-container {
      position: relative;
      height: 300px;
    }

    /* Activity Log */
    .activity-log {
      max-height: 400px;
      overflow-y: auto;
    }

    .activity-item {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      transition: background 0.2s;
    }

    .activity-item:hover {
      background: var(--bg-hover);
    }

    .activity-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .activity-item.trade .activity-icon { background: rgba(0, 208, 132, 0.1); color: var(--accent-green); }
    .activity-item.liquidity .activity-icon { background: rgba(155, 89, 182, 0.1); color: var(--accent-purple); }
    .activity-item.fund .activity-icon { background: rgba(52, 152, 219, 0.1); color: var(--accent-blue); }

    .activity-content {
      flex: 1;
    }

    .activity-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .activity-desc {
      color: var(--text-secondary);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .activity-time {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .activity-amount {
      font-weight: 700;
      font-size: 14px;
    }

    /* Refresh Button */
    .refresh-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .refresh-btn:hover {
      background: var(--bg-hover);
      border-color: var(--accent-cyan);
    }

    .refresh-btn.spinning i {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--text-secondary);
    }

    /* Loading */
    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      color: var(--text-secondary);
    }

    .loading i {
      animation: spin 1s linear infinite;
      margin-right: 10px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <header class="header">
    <div class="logo">
      <div class="logo-icon">
        <i class="fas fa-network-wired"></i>
      </div>
      <div class="logo-text">
        <h1>Agent Mesh</h1>
        <p>AI Trading Swarm on Solana</p>
      </div>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <div class="status-indicator">
        <div class="status-dot"></div>
        <span>Live Trading</span>
      </div>
      <div id="dataSourceIndicator" style="
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        background: rgba(139, 139, 158, 0.1);
        color: #8b8b9e;
        border: 1px solid var(--border-color);
      ">● Connecting...</div>
    </div>
  </header>

  <div class="container">
    <!-- Stats Overview -->
    <div class="stats-grid">
      <div class="stat-card green">
        <div class="stat-header">
          <div class="stat-icon">
            <i class="fas fa-chart-line"></i>
          </div>
          <div class="stat-change positive" id="totalTradesChange">+12%</div>
        </div>
        <div class="stat-value" id="totalTrades">0</div>
        <div class="stat-label">Total Trades</div>
      </div>

      <div class="stat-card purple">
        <div class="stat-header">
          <div class="stat-icon">
            <i class="fas fa-coins"></i>
          </div>
          <div class="stat-change positive" id="totalVolumeChange">+8.5%</div>
        </div>
        <div class="stat-value" id="totalVolume">0 SOL</div>
        <div class="stat-label">Total Volume</div>
      </div>

      <div class="stat-card blue">
        <div class="stat-header">
          <div class="stat-icon">
            <i class="fas fa-wallet"></i>
          </div>
          <div class="stat-change" id="totalPnLChange">+0%</div>
        </div>
        <div class="stat-value" id="totalPnL">0 SOL</div>
        <div class="stat-label">Total P&L</div>
      </div>

      <div class="stat-card red">
        <div class="stat-header">
          <div class="stat-icon">
            <i class="fas fa-robot"></i>
          </div>
          <div class="stat-change positive">100%</div>
        </div>
        <div class="stat-value" id="activeAgents">4</div>
        <div class="stat-label">Active Agents</div>
      </div>
    </div>

    <!-- Agent Cards -->
    <div class="section-title">
      <i class="fas fa-users"></i>
      <span>Active Agents</span>
    </div>
    <div class="agents-grid" id="agentsGrid">
      <!-- Agents will be populated by JS -->
    </div>

    <!-- Charts & Activity -->
    <div class="dashboard-grid">
      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <i class="fas fa-chart-bar"></i>
            <span>Trading Volume</span>
          </div>
          <button class="refresh-btn" onclick="refreshData()">
            <i class="fas fa-sync-alt"></i>
            Refresh
          </button>
        </div>
        <div class="chart-container">
          <canvas id="volumeChart"></canvas>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <div class="card-title">
            <i class="fas fa-history"></i>
            <span>Recent Activity</span>
          </div>
        </div>
        <div class="activity-log" id="activityLog">
          <!-- Activity items will be populated by JS -->
        </div>
      </div>
    </div>

    <!-- Transactions Table -->
    <div class="card transactions-card">
      <div class="card-header">
        <div class="card-title">
          <i class="fas fa-exchange-alt"></i>
          <span>Recent Transactions</span>
        </div>
        <button class="refresh-btn" onclick="refreshData()">
          <i class="fas fa-sync-alt"></i>
          Refresh
          </button>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Time</th>
              <th>Agent</th>
              <th>Type</th>
              <th>Token</th>
              <th>Action</th>
              <th>Amount</th>
              <th>P&L</th>
              <th>Transaction</th>
            </tr>
          </thead>
          <tbody id="transactionsTable">
            <!-- Transactions will be populated by JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
